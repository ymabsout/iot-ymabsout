apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: dev
  labels: {app: playground}
spec:
  replicas: 1
  selector:
    matchLabels: {app: playground}
  template:
    metadata:
      labels: {app: playground}
    spec:
      containers:
        - name: playground
          image: wil42/playground:v1
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet: {path: /, port: 8888}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8888}
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  namespace: dev
spec:
  type: NodePort
  selector: {app: playground}
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888
